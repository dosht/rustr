[package]
name = "billing-http"
description = "Axum contract and router for billing-core use cases. Identity and admin policy are host ports."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
billing-core = { path = "../core" }
axum = "0.8"
base64 = "0.22"
serde.workspace = true
serde_json.workspace = true
percent-encoding = "2"
subtle = "2"
tokio = { version = "1", features = ["rt", "macros"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
billing-postgres = { path = "../postgres" }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "migrate", "macros", "json", "uuid"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync"] }
