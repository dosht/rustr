name: PRD gates

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    name: ${{ matrix.gate }} readiness
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        gate: [rustr, modules, transgate, p2-billing]
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rustr
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d rustr"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20
    env:
      BILLING_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/rustr
      TASKR_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/rustr
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: clippy
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
      - name: Install book dependencies
        if: matrix.gate == 'rustr'
        run: npm ci --prefix book --no-fund --no-audit
      # transgate-export's PDF tests read generated PDFs with Poppler pdftotext (bidi-aware independent
      # reader); they fail, never skip, when it is missing.
      - name: Install poppler-utils
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends poppler-utils
      - name: Run complete gate
        run: ./scripts/gate-${{ matrix.gate }}.sh
