# Explicit --config for OMP worker sessions. No model-role, memory or auth changes.
retry:
  modelFallback: false
  # Wait for the provider's authoritative usage reset instead of failing the turn.
  waitForUsageReset: true
# Shows Claude usage in the status line and warns at the limit.
extensions:
  - /home/mu/src/rustr/scripts/lead-workflow/claude-usage-gate.ts
