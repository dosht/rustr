[package]
name = "transgate-processor"
description = "Transgate free-tools processor: the seven server-first FFmpeg tool families behind anonymous session upload/process/progress/download routes, with ten-minute cleanup. A separate deployable."
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "transgate-processor"
path = "src/main.rs"

[dependencies]
transgate-core = { path = "../core" }
axum = "0.8"
base64 = "0.22"
bytes = "1"
# Already required by flate2.
crc32fast = "1"
# Express's body-parser inflates gzip and deflate JSON bodies; pure-Rust zlib-rs backend.
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }
futures-core = "0.3"
http-body-util = "0.1"
serde.workspace = true
serde_json.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "process", "fs", "time", "io-util"] }
tokio-util = { version = "0.7", features = ["io"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
reqwest = { version = "0.13", default-features = false }
tokio = { version = "1", features = ["test-util"] }
