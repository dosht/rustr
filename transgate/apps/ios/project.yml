# XcodeGen spec: `xcodegen generate` (run by scripts/build-transgate-ios.sh on macOS) turns this
# into Transgate.xcodeproj, so no Xcode project file lives in git.
name: Transgate
options:
  bundleIdPrefix: dev.transgate
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
targets:
  Transgate:
    type: application
    platform: iOS
    sources:
      - Transgate/Core
      - Transgate/Platform
      - Transgate/UI
      - Transgate/DesignTokens.swift
      - Generated/TransgateCore.swift
      # Bundled document assets (D10): every font, its licence notice and the invoice logo,
      # copied flat into the app so NativePorts.asset(name) finds them by file name.
      - path: ../../export/fonts
        buildPhase: resources
      - path: ../../export/assets/invoice-logo.jpg
        buildPhase: resources
      # The login logo (`Image("logo")`), the same file the web app uses.
      - path: ../../web/src/lib/features/app/art/logo.png
        buildPhase: resources
    dependencies:
      - framework: TransgateCore.xcframework
        embed: false
    info:
      path: Transgate/Info.plist
      properties:
        CFBundleDisplayName: Transgate
        # The addresses core talks to. Set per build (see README.md); empty means "not set"
        # and the app shows its configuration error instead of guessing.
        TransgateApiUrl: $(TRANSGATE_API_URL)
        TransgateAuthUrl: $(TRANSGATE_AUTH_URL)
        TransgateAuthKey: $(TRANSGATE_AUTH_KEY)
        TransgateSiteUrl: $(TRANSGATE_SITE_URL)
        TransgateWebUrl: $(TRANSGATE_WEB_URL)
        # The custom scheme GoTrue returns through (D7): transgate://app/<locale>/home?code=...
        CFBundleURLTypes:
          - CFBundleURLName: dev.transgate.auth
            CFBundleURLSchemes: [transgate]
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.transgate.ios
        TRANSGATE_API_URL: ""
        TRANSGATE_AUTH_URL: ""
        TRANSGATE_AUTH_KEY: ""
        TRANSGATE_SITE_URL: "transgate://app"
        TRANSGATE_WEB_URL: ""
