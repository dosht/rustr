# XcodeGen spec: `xcodegen generate` (run by scripts/build-ios.sh on macOS)
# turns this into Taskr.xcodeproj, so no Xcode project file lives in git.
name: Taskr
options:
  bundleIdPrefix: dev.taskr
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
targets:
  Taskr:
    type: application
    platform: iOS
    sources:
      - Taskr
      - Generated/TaskrCore.swift
    dependencies:
      - framework: TaskrCore.xcframework
        embed: false
    info:
      path: Taskr/Info.plist
      properties:
        # Signed-in mode. The simulator reaches the Mac's dev server at localhost.
        TaskrApiUrl: $(TASKR_API_URL)
        TaskrAuthUrl: $(TASKR_AUTH_URL)
        TaskrAuthKey: $(TASKR_AUTH_KEY)
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UILaunchScreen: {}
        CFBundleDisplayName: taskr
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.taskr.ios
        TASKR_API_URL: ""
        TASKR_AUTH_URL: ""
        TASKR_AUTH_KEY: ""
