# XcodeGen spec: `xcodegen generate` (run by scripts/build-ios.sh on macOS)
# turns this into Taskr.xcodeproj, so no Xcode project file lives in git.
name: Taskr
options:
  bundleIdPrefix: dev.taskr
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
targets:
  Taskr:
    type: application
    platform: iOS
    sources:
      - Taskr
      - Generated/TaskrCore.swift
    dependencies:
      - framework: TaskrCore.xcframework
        embed: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.taskr.ios
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: taskr
