[package]
name = "llm-http"
description = "Concrete LLM HTTP adapters and portable bounded application SSE codecs"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
llm-core = { path = "../llm-core" }
serde.workspace = true
serde_json.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "stream"] }
tokio = { version = "1", features = ["sync", "time", "rt"] }
bytes = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util", "sync", "time", "test-util"] }
futures-util = "0.3"
