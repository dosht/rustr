[package]
name = "taskr-ffi"
description = "UniFFI facade: the Kotlin and Swift API of the core. Treat it as a public, versioned API."
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["lib", "cdylib", "staticlib"]
name = "taskr_ffi"

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["cli"]

[features]
cli = ["uniffi/cli"]

[dependencies]
taskr-core.workspace = true
taskr-infra = { workspace = true, features = ["native"] }
uniffi.workspace = true
