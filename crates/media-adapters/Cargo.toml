[package]
name = "media-adapters"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
media-ports = { path = "../media-ports" }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "stream"] }
tokio = { version = "1", features = ["net", "fs", "io-util", "time", "rt"] }
tokio-util = { version = "0.7", features = ["io"] }
futures-util = "0.3"
rusty-s3 = { version = "0.10", default-features = false, features = ["rustcrypto"] }
jiff = "0.2"
quick-xml = { version = "0.38", features = ["serialize"] }
roxmltree = "0.21"
html-escape = "0.2"
serde = { workspace = true }
serde_json = { workspace = true }
url = "2"
base64 = "0.22"
subtle = "2.6"
tempfile = "3"

[dev-dependencies]
axum = "0.8"
bytes = "1"
hmac = "0.12"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "time", "sync"] }
