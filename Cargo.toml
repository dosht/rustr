[workspace]
resolver = "3"
members = [
    "crates/*",
    "transgate/server",
    "transgate/billing",
    "transgate/core",
    "transgate/processor",
    "transgate/api",
    "transgate/http",
    "transgate/export",
    "transgate/jobs-postgres",
    "transgate/client",
    "transgate/i18n",
    "transgate/ffi",
    "transgate/native",
    "transgate/cli",
    "transgate/tui",
    "transgate/wasm",
    "modules/billing/core",
    "modules/billing/postgres",
    "modules/billing/http",
    "modules/billing/gateways/iyzico",
    "modules/billing/gateways/lemonsqueezy",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
taskr-core = { path = "crates/taskr-core" }
taskr-infra = { path = "crates/taskr-infra", default-features = false }
taskr-api = { path = "crates/taskr-api" }
taskr-client = { path = "crates/taskr-client" }
taskr-postgres = { path = "crates/taskr-postgres" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4.6", features = ["derive"] }
ratatui = "0.30"
dirs = "6"
uniffi = "0.32"
wasm-bindgen = "=0.2.128"
js-sys = "0.3"
serde-wasm-bindgen = "0.6"
ts-rs = "12"

[profile.release]
lto = true
opt-level = "s"
strip = true
